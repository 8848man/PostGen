<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PostGen Next</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><span>POSTGEN / NEXT</span><h1>계정별 글 제작과 예약</h1><p>자료를 직접 선택해 글을 만들고, 채널별로 검토한 뒤 편집기 준비 시간을 정합니다.</p></header>
<section><h2>계정</h2><form id="account"><label>채널<select name="channel"><option value="naver">네이버 블로그</option><option value="tistory">티스토리</option></select></label><label>블로그 ID (네이버 URL 경로 또는 티스토리 하위 도메인)<input name="handle" required></label><label>기본 목표<input name="defaultGoal" required placeholder="예: 실무 사례를 쉽게 설명"></label><button>계정 추가</button></form></section>
<section><h2>골든 샘플</h2><p>샘플의 일반적 특징을 추출한 뒤 규칙을 직접 고쳐 승인합니다.</p><form id="sample"><label>계정<select name="accountId" id="sample-accounts" required></select></label><label>형식<select name="sourceType"><option value="text">텍스트</option><option value="file">파일 경로</option><option value="url">공개 URL</option><option value="screenshot">화면 캡처 파일 경로</option></select></label><label>샘플 내용 또는 위치<textarea name="sourceRef" rows="4" required></textarea></label><label>자료 권한<select name="rights"><option value="owned">내가 만든 자료</option><option value="licensed">사용 권한이 있는 자료</option><option value="public_style">타인의 공개 자료: 일반적 스타일만</option></select></label><button>분석 제안 보기</button></form><pre id="analysis"></pre><div id="samples"></div></section>
<section><h2>이미지 자산</h2><form id="asset"><label>계정<select name="accountId" id="asset-accounts" required></select></label><label>종류<select name="kind"><option value="character">캐릭터</option><option value="object">오브젝트</option><option value="background">배경</option></select></label><label>원본 이미지 절대 경로<input name="path" required></label><label>유지할 외형 특징<input name="features" required></label><label>사용 권한<select name="rights"><option value="owned">내 자산</option><option value="licensed">사용 허락받은 자산</option></select></label><button>자산 등록</button></form></section>
<section><h2>MCP 연결</h2><p>서버의 도구 목록을 확인하고 허용한 뒤에만 문서 읽기나 초안 준비에 사용합니다.</p><form id="connector"><label>연결 이름<input name="name" required></label><label>실행 파일 절대 경로<input name="command" required></label><label>인수 JSON 배열<input name="args" value="[]" required></label><button>서버 등록</button></form><div id="connectors"></div></section>
<section><h2>운영 설정</h2><form id="settings"><label>원본·중간 결과 보관 개월 수<select name="retentionMonths"><option value="1">1개월</option><option value="2">2개월</option><option value="3">3개월</option></select></label><label><input type="checkbox" name="backgroundNotifications">서버 실행 중 Windows 예약 알림</label><label><input type="checkbox" name="autoImageCheck">이미지 생성 후 자동 점검</label><label>이미지 총 생성 상한<select name="maxImageGenerations"><option value="1">1회</option><option value="2">2회</option><option value="3">3회</option></select></label><button>설정 저장</button></form></section>
<section><h2>새 글</h2><form id="job"><label>게시 계정 (Ctrl 키로 여러 계정 선택)<select name="accountIds" id="accounts" multiple required size="4"></select></label><label>독자<input name="audience" required placeholder="예: 처음 접하는 실무자"></label><label>모델<select name="model"><option value="codex">Codex</option><option value="claude">Claude Code</option><option value="openai">OpenAI API</option><option value="anthropic">Anthropic API</option></select></label><label>직접 입력할 자료<textarea name="sourceText" rows="8" placeholder="이번 글에 사용할 자료를 붙여넣으세요"></textarea></label><label>또는 로컬 파일 경로<input name="sourcePath" placeholder="선택한 파일의 절대 경로"></label><label>또는 공개 URL<input name="sourceUrl" type="url" placeholder="https://..."></label><div><button id="discover" type="button">AI 작업 기록 찾기</button><div id="record-list"></div></div><label>연결 문서 서버<select name="connectorId" id="source-connectors"><option value="">선택 안 함</option></select></label><label>문서 읽기 도구 이름<input name="sourceToolName"></label><label>도구 인수 JSON<input name="sourceToolArgs" value="{}"></label><button>글 작업 만들기</button></form></section>
<section><h2>작업 목록</h2><div id="jobs" class="jobs"></div></section><output id="message" role="status"></output></main><script src="/app.js"></script></body></html>
